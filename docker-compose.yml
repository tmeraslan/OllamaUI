services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: app         # לא guest (guest מוגבל ל-localhost)
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # UI לניטור (אופציונלי)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user         # נשאר תואם ל-DATABASE_URL של YOLO (user/pass)
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: predictions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d predictions"]
      interval: 10s
      timeout: 5s
      retries: 12

  # YOLO API (גרסת 'latest' מה-Workflow של YOLO:  ${DOCKERHUB_USERNAME}/yolo:latest)
  yolo:
    image: ${DOCKERHUB_USERNAME}/yolo:latest
    container_name: yolo
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
    environment:
      PYTHONUNBUFFERED: "1"
      AWS_REGION: eu-west-1
      AWS_S3_BUCKET: tameer-yolo-images

      DB_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg2://user:pass@postgres:5432/predictions

      # RabbitMQ (לא דורש .env – כתובת ישירה לשירות rabbitmq ברשת של compose):
      RABBIT_URL: amqp://app:secret@rabbitmq:5672
      JOBS_QUEUE: img_jobs
      RESULTS_EX: img.results
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # YOLO Worker (אותה תמונה, פקודה שונה)
  yolo-worker:
    image: ${DOCKERHUB_USERNAME}/yolo:latest
    container_name: yolo-worker
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    environment:
      PYTHONUNBUFFERED: "1"
      AWS_REGION: eu-west-1
      AWS_S3_BUCKET: tameer-yolo-images

      DB_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg2://user:pass@postgres:5432/predictions

      RABBIT_URL: amqp://app:secret@rabbitmq:5672
      JOBS_QUEUE: img_jobs
      RESULTS_EX: img.results
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # ודא שהקובץ הזה קיים בתמונה (כמו אצלך repo/worker_receive.py)
    command: ["python", "worker_receive.py"]

  ollama-ui:
    image: ${DOCKERHUB_USERNAME}/ollama-ui:${OLLAMA_UI_IMG_TAG}
    container_name: ollama-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      AWS_REGION: eu-west-1
      AWS_S3_BUCKET: tameer-yolo-images
      YOLO_SERVICE: http://yolo:8081
    depends_on:
      - yolo
    command: ["npm", "start", "--", "-H", "0.0.0.0"]

volumes:
  postgres_data:
  rabbitmq_data:








