version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: predictions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-predictions}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-secret}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # UI לניטור
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  yolo:
    image: tameer/yolo:0.0.4
    container_name: yolo
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads 
    environment:
      PYTHONUNBUFFERED: "1"
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      DB_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespass}@postgres:5432/${POSTGRES_DB:-predictions}
      RABBIT_URL: amqp://${RABBIT_USER:-app}:${RABBIT_PASS:-secret}@rabbitmq:5672
      JOBS_QUEUE: ${JOBS_QUEUE:-img_jobs}
      RESULTS_EX: ${RESULTS_EX:-img.results}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  yolo-worker:
    image: tameer/yolo:0.0.4
    container_name: yolo-worker
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      DB_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespass}@postgres:5432/${POSTGRES_DB:-predictions}
      RABBIT_URL: amqp://${RABBIT_USER:-app}:${RABBIT_PASS:-secret}@rabbitmq:5672
      JOBS_QUEUE: ${JOBS_QUEUE:-img_jobs}
      RESULTS_EX: ${RESULTS_EX:-img.results}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-u", "worker_receive.py"]

  ollama-ui:
    image: ${DOCKERHUB_USERNAME}/ollama-ui:${OLLAMA_UI_IMG_TAG}
    container_name: ollama-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      YOLO_SERVICE: http://yolo:8081
      RABBIT_URL: amqp://${RABBIT_USER:-app}:${RABBIT_PASS:-secret}@rabbitmq:5672
      JOBS_QUEUE: ${JOBS_QUEUE:-img_jobs}
      RESULTS_EX: ${RESULTS_EX:-img.results}
    depends_on:
      yolo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["npm", "start", "--", "-H", "0.0.0.0"]

volumes:
  postgres_data:








