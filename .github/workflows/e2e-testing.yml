# # .github/workflows/e2e-testing.yml
name: Simple Deploy to EC2

on:
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build_push.outputs.image_tag }}
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Build and push Docker image (ollama-ui)
        id: build_push
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          TAG="${{ github.sha }}-$(date +%Y%m%d-%H%M%S)"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ollama-ui:$TAG .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ollama-ui:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy on EC2 via SSH (cleanup + docker data-root + pre-pull + compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          command_timeout: 45m
          script: |
            set -xeuo pipefail
            export DEBIAN_FRONTEND=noninteractive
            cd /home/ubuntu

            #### 0) Stop services & free space (avoid apt locks)
            sudo systemctl stop docker containerd 2>/dev/null || true
            sudo systemctl stop --now apt-daily.service apt-daily.timer apt-daily-upgrade.service apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
            for i in {1..30}; do
              if sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
                echo "waiting apt locks... ($i)"; sleep 2
              else
                break
              fi
            done

            timeout 60s sudo journalctl --vacuum-time=3d || true
            timeout 60s sudo journalctl --vacuum-size=200M || true
            sudo find /var/log -type f -name "*.log" -size +10M -exec sudo truncate -s 0 {} \; || true
            sudo rm -rf /var/tmp/* /tmp/* || true
            sudo rm -rf /var/lib/apt/lists/* || true
            sudo apt-get clean || true
            sudo apt-get autoremove -y || true
            sudo mkdir -p /var/lib/apt/lists/partial || true

            #### 1) If root fs is too small, wipe old docker/containerd data
            FREE_KB=$(df --output=avail -k / | tail -1 || echo 0)
            echo "Free space (KB): $FREE_KB"
            if [ "$FREE_KB" -lt 5242880 ]; then   # < 5GB
              echo "Low space on / – removing old Docker & Containerd data"
              sudo rm -rf /var/lib/docker /var/lib/containerd || true
            fi

            #### 2) Install Docker (if missing)
            timeout 180s sudo apt-get update -y || true
            sudo apt-get remove -y podman-docker podman || true
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release; echo $VERSION_CODENAME) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              timeout 180s sudo apt-get update -y || true
              timeout 600s sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            #### 3) Move Docker data-root off / (to /home/ubuntu/docker-data)
            sudo mkdir -p /etc/docker
            sudo mkdir -p /home/ubuntu/docker-data
            cat | sudo tee /etc/docker/daemon.json >/dev/null <<'JSON'
            {
              "data-root": "/home/ubuntu/docker-data",
              "log-driver": "json-file",
              "log-opts": { "max-size": "10m", "max-file": "3" }
            }
            JSON

            sudo systemctl daemon-reload
            sudo systemctl enable docker || true
            sudo systemctl restart docker
            if ! sudo systemctl is-active --quiet docker; then
              echo "Docker service is not active. Recent logs:"
              sudo journalctl -u docker -n 200 --no-pager || true
              exit 1
            fi
            docker --version
            docker info | grep -E "Docker Root Dir|Driver" || true
            df -h /home/ubuntu/docker-data || true

            #### 4) Docker login
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            #### 5) Write .env and docker-compose.yml
            sudo mkdir -p uploads
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            OLLAMA_UI_IMG_TAG=${{ env.IMAGE_TAG }}
            YOLO_TAG=latest

            YOLO_SERVICE=http://yolo:8081

            AWS_REGION=eu-west-1
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}

            RABBIT_USER=app
            RABBIT_PASS=secret
            JOBS_QUEUE=img_jobs
            RESULTS_EX=img.results

            POSTGRES_USER=user
            POSTGRES_PASSWORD=pass
            POSTGRES_DB=predictions
            POSTGRES_VERSION=15

            YOLO_PORT=8081
            OLLAMA_PORT=3000
            POSTGRES_PORT=5432
            EOF

            cat > docker-compose.yml <<'YAML'
            services:
              postgres:
                image: postgres:${POSTGRES_VERSION:-15}-alpine
                container_name: postgres
                restart: unless-stopped
                environment:
                  POSTGRES_USER: ${POSTGRES_USER:-user}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
                  POSTGRES_DB: ${POSTGRES_DB:-predictions}
                ports:
                  - "${POSTGRES_PORT:-5432}:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-predictions}"]
                  interval: 10s
                  timeout: 5s
                  retries: 10

              rabbitmq:
                image: rabbitmq:4.0-management-alpine
                container_name: rabbitmq
                restart: unless-stopped
                environment:
                  RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-app}
                  RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-secret}
                ports:
                  - "5672:5672"
                  - "15672:15672"
                healthcheck:
                  test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 12

              yolo:
                image: ${DOCKERHUB_USERNAME}/yolo:${YOLO_TAG:-latest}
                container_name: yolo
                restart: unless-stopped
                ports:
                  - "${YOLO_PORT:-8081}:8081"
                volumes:
                  - ./uploads:/app/uploads
                environment:
                  PYTHONUNBUFFERED: "1"
                  AWS_REGION: ${AWS_REGION}
                  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
                  DB_BACKEND: postgres
                  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-predictions}
                  RABBIT_URL: amqp://${RABBIT_USER:-app}:${RABBIT_PASS:-secret}@rabbitmq:5672
                  JOBS_QUEUE: ${JOBS_QUEUE:-img_jobs}
                  RESULTS_EX: ${RESULTS_EX:-img.results}
                depends_on:
                  postgres:
                    condition: service_healthy
                  rabbitmq:
                    condition: service_healthy

              yolo-worker:
                image: ${DOCKERHUB_USERNAME}/yolo:${YOLO_TAG:-latest}
                container_name: yolo-worker
                restart: unless-stopped
                volumes:
                  - ./uploads:/app/uploads
                environment:
                  AWS_REGION: ${AWS_REGION}
                  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
                  DB_BACKEND: postgres
                  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-predictions}
                  RABBIT_URL: amqp://${RABBIT_USER:-app}:${RABBIT_PASS:-secret}@rabbitmq:5672
                  JOBS_QUEUE: ${JOBS_QUEUE:-img_jobs}
                  RESULTS_EX: ${RESULTS_EX:-img.results}
                depends_on:
                  postgres:
                    condition: service_healthy
                  rabbitmq:
                    condition: service_healthy
                command: ["python", "-u", "worker_receive.py"]

              ollama-ui:
                image: ${DOCKERHUB_USERNAME}/ollama-ui:${OLLAMA_UI_IMG_TAG}
                container_name: ollama-ui
                restart: unless-stopped
                ports:
                  - "${OLLAMA_PORT:-3000}:3000"
                environment:
                  PORT: "3000"
                  AWS_REGION: ${AWS_REGION}
                  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
                  YOLO_SERVICE: http://yolo:8081
                  RABBIT_URL: amqp://${RABBIT_USER:-app}:${RABBIT_PASS:-secret}@rabbitmq:5672
                  JOBS_QUEUE: ${JOBS_QUEUE:-img_jobs}
                  RESULTS_EX: ${RESULTS_EX:-img.results}
                depends_on:
                  yolo:
                    condition: service_started
                  rabbitmq:
                    condition: service_healthy
                command: ["npm", "start", "--", "-H", "0.0.0.0"]

            volumes:
              postgres_data:
            YAML

            echo "== Disk usage BEFORE pulls =="
            df -h || true
            sudo docker system df || true

            #### 6) Pre-pull per image with timeouts (clear logs between pulls)
            timeout 420s sudo docker pull postgres:${POSTGRES_VERSION:-15}-alpine
            timeout 420s sudo docker pull rabbitmq:4.0-management-alpine
            timeout 1500s sudo docker pull ${DOCKERHUB_USERNAME}/yolo:${YOLO_TAG:-latest}
            timeout 900s  sudo docker pull ${DOCKERHUB_USERNAME}/ollama-ui:${OLLAMA_UI_IMG_TAG}

            echo "== Compose up =="
            sudo docker compose --env-file .env down || true
            timeout 900s sudo docker compose --env-file .env up -d
            sudo docker compose --env-file .env ps

  selenium-matrix-tests:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      matrix:
        browser: [chrome, firefox]
        resolution:
          - { name: "desktop-full", width: 1920, height: 1080 }
          - { name: "laptop",       width: 1366, height: 768 }
          - { name: "tablet",       width: 1024, height: 768 }
          - { name: "mobile",       width: 375,  height: 667 }
      fail-fast: false
    name: Test ${{ matrix.browser }} - ${{ matrix.resolution.name }}

    steps:
      - name: Checkout OllamaUITesting
        uses: actions/checkout@v4
        with:
          repository: tmeraslan/OllamaUITesting
          path: .
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Setup Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Wait for app to be ready (same URL used by tests)
        env:
          URL: http://${{ secrets.EC2_HOST }}:3000/
        run: |
          for i in {1..60}; do
            if curl -fsS "$URL" >/dev/null; then
              echo "App is up: $URL"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 5
          done
          echo "App not ready at $URL" >&2
          exit 1

      - name: Create Allure environment (global)
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties << EOF
          Target.URL=http://${{ secrets.EC2_HOST }}:3000/
          Commit=${{ github.sha }}
          OllamaUI.Image=${{ secrets.DOCKERHUB_USERNAME }}/ollama-ui:${{ needs.deploy.outputs.image_tag }}
          YOLO.Image=${{ secrets.DOCKERHUB_USERNAME }}/yolo:latest
          Postgres.Image=postgres:15-alpine
          CI.Platform=GitHub Actions
          EOF

      - name: Inject Allure matrix params (browser/resolution as test parameters)
        run: |
          cat > conftest.py << 'PY'
          import os, pytest
          try:
              import allure
          except Exception:
              allure = None

          @pytest.fixture(autouse=True)
          def _allure_add_matrix_params():
              if not allure:
                  return
              browser = os.getenv('BROWSER', 'unknown')
              res_name = os.getenv('TEST_NAME', 'unknown')
              width = os.getenv('SCREEN_WIDTH', '')
              height = os.getenv('SCREEN_HEIGHT', '')
              try:
                  allure.dynamic.parameter('browser', browser)
                  allure.dynamic.parameter('resolution', res_name)
                  if width and height:
                      allure.dynamic.parameter('screen', f"{width}x{height}")
              except Exception:
                  pass
          PY

      - name: Run Selenium tests
        env:
          HEADLESS: true
          BROWSER: ${{ matrix.browser }}
          SCREEN_WIDTH: ${{ matrix.resolution.width }}
          SCREEN_HEIGHT: ${{ matrix.resolution.height }}
          RESOLUTION: ${{ matrix.resolution.name }}
          OLLAMA_URL: http://${{ secrets.EC2_HOST }}:3000/
          TEST_NAME: ${{ matrix.browser }}-${{ matrix.resolution.name }}
          ENVIRONMENT: staging
        run: |
          mkdir -p allure-results
          URL="${OLLAMA_URL%/}/"
          for i in {1..30}; do
            if curl -fsS "$URL" >/dev/null; then
              break
            fi
            echo "Retry app check... ($i)"
            sleep 3
          done
          pytest --alluredir=allure-results tests/

      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}-${{ matrix.resolution.name }}
          path: allure-results/
          retention-days: 30

  allure-report:
    runs-on: ubuntu-latest
    needs: selenium-matrix-tests
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-downloaded
          merge-multiple: false

      - name: Merge all results into single directory (and set global environment)
        run: |
          mkdir -p allure-results
          for dir in allure-results-downloaded/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir"* allure-results/ 2>/dev/null || true
            fi
          done

          cat > allure-results/categories.json << 'EOF'
          [
            {"name": "Chrome",  "matchedStatuses": ["passed","failed","broken"], "messageRegex": ".*chrome.*"},
            {"name": "Firefox", "matchedStatuses": ["passed","failed","broken"], "messageRegex": ".*firefox.*"},
            {"name": "Desktop", "matchedStatuses": ["passed","failed","broken"], "messageRegex": ".*desktop.*"},
            {"name": "Mobile",  "matchedStatuses": ["passed","failed","broken"], "messageRegex": ".*mobile.*"},
            {"name": "Tablet",  "matchedStatuses": ["passed","failed","broken"], "messageRegex": ".*tablet.*"},
            {"name": "Laptop",  "matchedStatuses": ["passed","failed","broken"], "messageRegex": ".*laptop.*"}
          ]
          EOF

          cat > allure-results/environment.properties << EOF
          Target.URL=http://${{ secrets.EC2_HOST }}:3000/
          Commit=${{ github.sha }}
          OllamaUI.Image=${{ secrets.DOCKERHUB_USERNAME }}/ollama-ui:${{ needs.deploy.outputs.image_tag }}
          YOLO.Image=${{ secrets.DOCKERHUB_USERNAME }}/yolo:latest
          Postgres.Image=postgres:15-alpine
          CI.Platform=GitHub Actions
          EOF

          echo "Allure files:"
          ls -la allure-results || true

      - name: Generate and Deploy Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.UI_TESTING_GITHUB_TOKEN }}
          publish_dir: allure-history






